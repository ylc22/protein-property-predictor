name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r protein-property-predictor/env/requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Import smoke test
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'protein-property-predictor')
          import features
          import model
          import api
          print('imports ok')
          PY
